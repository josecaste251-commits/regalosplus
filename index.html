/* Boutique editorial: crema y negro con acento rosado de lazo. Una sola apariencia clara, elegida a propósito. */
:root{

/* ---------- precios y ofertas ---------- */
function activeOffers(){var t=todayMGA();return (S.offers||[]).filter(function(o){return o.active&&(!o.start||o.start<=t)&&(!o.end||o.end>=t)})}
function priceOf(p){var base=Number(p.price)||0,best=null,bestPrice=base;activeOffers().forEach(function(o){var hit=o.target==='all'||o.target==='prod:'+p.id||(o.target.indexOf('cat:')===0&&p.cats.indexOf(o.target.slice(4))>=0);if(!hit)return;var np=o.type==='percent'?Math.round(base*(1-Number(o.value)/100)):Number(o.value);if(np<bestPrice){bestPrice=np;best=o}});var compare=best?Math.max(base,Number(p.compareAt)||0):(Number(p.compareAt)>base?Number(p.compareAt):null);return {now:bestPrice,was:compare,offer:best,label:best?(best.label||'SALE'):(compare?'SALE':(p.tag||''))}}
function priceHTML(p){var pr=priceOf(p);if(!(pr.now>0))return '<div class="price"><span class="now ask">Precio a consultar</span></div>';return '<div class="price"><span class="now'+(pr.was?' sale':'')+'">'+money(pr.now)+'</span>'+(pr.was?'<s>'+money(pr.was)+'</s>':'')+'</div>'}
function tagHTML(p){if(!p.stock)return '<span class="tag out">Agotado</span>';var pr=priceOf(p);if(!pr.label)return '';var cls=/LIMITADA/i.test(pr.label)?'lim':(/SALE|OFERTA/i.test(pr.label)?'sale':'');return '<span class="tag '+cls+'">'+esc(pr.label)+'</span>'}
function visibleProducts(){return S.products.filter(function(p){return p.published})}
function catById(id){return S.categories.filter(function(c){return c.id===id})[0]}

/* ---------- carrito ---------- */
var cart=store('mt-cart')||[];
function saveCart(){store('mt-cart',cart)}
function prodById(id){return S.products.filter(function(p){return p.id===id})[0]}
function lineUnit(l){var p=prodById(l.id);if(!p)return 0;var u=priceOf(p).now;(p.options||[]).forEach(function(o){if(o.type==='select'){var v=l.opts[o.name];o.choices.forEach(function(ch){if(ch.label===v)u+=Number(ch.extra)||0})}});return u}
function cartCount(){return cart.reduce(function(a,l){return a+l.qty},0)}
function cartSubtotal(){return cart.reduce(function(a,l){return a+lineUnit(l)*l.qty},0)}
function addToCart(p,opts,qty){var key=p.id+'|'+JSON.stringify(opts||{});var ex=cart.filter(function(l){return l.key===key})[0];if(ex)ex.qty+=qty||1;else cart.push({key:key,id:p.id,qty:qty||1,opts:opts||{}});saveCart();updateBadge(true);trk('add_to_cart',{currency:'NIO',value:priceOf(p).now*(qty||1),items:[{item_id:p.id,item_name:p.name,price:priceOf(p).now,quantity:qty||1}]})}
function cleanCart(){cart=cart.filter(function(l){var p=prodById(l.id);return p&&p.published&&p.stock});saveCart()}
function trk(n,p){try{if(window.track)window.track(n,p)}catch(e){}}
function updateBadge(pop){var b=$('#cartBadge');if(!b)return;var n=cartCount();b.textContent=n;b.hidden=!n;if(pop){b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}}

/* ---------- pedidos (base de datos privada) ---------- */
function startOrders(){
 cap('db').then(function(db){caps.db=db;if(!db){if(admTab==='pedidos'||admTab==='resumen')drawAdmin();return}
  var timer=setTimeout(function(){caps.ordersSlow=true;if(admTab==='pedidos')drawAdmin()},10000);
  ordersUnsub=db.collection('orders').orderBy('createdAt','desc').onSnapshot(function(snap){clearTimeout(timer);caps.ordersSlow=false;orders=snap.docs.map(function(d){var x=d.data()||{};x._id=d.id;return x});if($('#adm')&&(admTab==='pedidos'||admTab==='resumen')&&!$('#ordImport:focus'))drawAdmin()},function(e){clearTimeout(timer);caps.ordersErr=e&&e.code;if(admTab==='pedidos')drawAdmin()});
 });
}
var ordFilter={st:'Todos',q:'',from:'',to:''};
function parseOrder(text){
 var o={raw:text.trim(),items:[]};var lines=text.split(/\r?\n/).map(function(l){return l.trim()});
 function val(label){for(var i=0;i<lines.length;i++){var m=lines[i].match(new RegExp('^\\*?'+label+'\\*?\\s*:?\\s*(.*)$','i'));if(m)return m[1].trim()}return ''}
 function num(s){var n=String(s||'').replace(/[^\d]/g,'');return n?Number(n):0}
 o.num=val('Pedido').replace('#','')||('M'+Date.now().toString(36).toUpperCase().slice(-5));o.name=val('Cliente');o.phone=val('Teléfono');o.sub=num(val('Subtotal'));o.total=num(val('TOTAL'));var env=val('Envío');o.ship=/gratis|retiro/i.test(env)?0:num(env);o.mode=/retiro/i.test(env)||/ENTREGA:\s*Retiro/i.test(text)?'pickup':'delivery';
 var d=lines.filter(function(l){return /^Descuento/i.test(l)})[0];o.disc=d?num(d.split(':').pop()):0;
 var inP=false;lines.forEach(function(l){if(/^PRODUCTOS/i.test(l)){inP=true;return}if(inP){if(!l||/^Subtotal/i.test(l)){inP=false;return}if(/^[-*•]/.test(l)){var parts=l.replace(/^[-*•]\s*/,'');var i=parts.lastIndexOf(':');o.items.push({name:i>0?parts.slice(0,i):parts,price:i>0?num(parts.slice(i+1)):0,qty:1})}}});
 o.addressText=[val('Barrio')?'Barrio: '+val('Barrio'):'',val('Dirección exacta'),val('Referencias')].filter(Boolean).join(' · ');
 o.dateText=val('Fecha de entrega');o.time=val('Hora');o.pay=val('Método de pago');o.notes=val('Instrucciones');return o}
function aPedidos(v){
 if(caps.db===undefined){v.innerHTML='<h3>Mis pedidos</h3><p class="muted">Cargando pedidos…</p>';return}
 if(!caps.db){v.innerHTML='<h3>Mis pedidos</h3><p class="muted">No se pudo abrir la base de datos de pedidos. Abre el panel con tu cuenta de Claude conectada.</p>';return}
 var list=orders.filter(function(o){if(ordFilter.st!=='Todos'&&o.status!==ordFilter.st)return false;if(ordFilter.q&&String(o.num).toLowerCase().indexOf(ordFilter.q.toLowerCase().replace('#',''))<0&&String(o.name||'').toLowerCase().indexOf(ordFilter.q.toLowerCase())<0)return false;if(ordFilter.from&&(o.createdDay||'')<ordFilter.from)return false;if(ordFilter.to&&(o.createdDay||'')>ordFilter.to)return false;return true});
 var counts={};orders.forEach(function(o){counts[o.status]=(counts[o.status]||0)+1});
 v.innerHTML='<h3>Mis pedidos</h3><div class="card" style="margin-bottom:18px"><label for="ordImport" class="lab" style="font:500 12px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase">Registrar un pedido de WhatsApp</label><p class="note" style="margin:6px 0 10px">Copia el mensaje del pedido que te llegó por WhatsApp y pégalo aquí. Se guarda en tu lista privada.</p><textarea class="in" id="ordImport" placeholder="NUEVO PEDIDO&#10;Pedido: #1117-ABC&#10;Cliente: ..."></textarea><div style="margin-top:10px"><button class="btn" id="ordSave">Guardar pedido</button></div></div>'+
 (caps.ordersErr?'<p class="err">No se pudieron leer los pedidos ('+esc(caps.ordersErr)+').</p>':'')+(caps.ordersSlow&&!orders.length?'<p class="muted">Los pedidos están tardando en cargar.</p>':'')+
 '<div class="chips" style="margin-bottom:12px">'+['Todos'].concat(STATUSES).map(function(s){return '<button class="chip" data-st="'+esc(s)+'" aria-pressed="'+(ordFilter.st===s)+'">'+esc(s)+(s!=='Todos'&&counts[s]?' ('+counts[s]+')':'')+'</button>'}).join('')+'</div>'+
 '<div class="fgrid two" style="margin-bottom:18px"><div class="field"><label for="of-q" class="lab">Buscar por número o cliente</label><input class="in" id="of-q" type="search" value="'+esc(ordFilter.q)+'"></div><div class="fgrid two"><div class="field"><label for="of-from" class="lab">Desde</label><input class="in" type="date" id="of-from" value="'+esc(ordFilter.from)+'"></div><div class="field"><label for="of-to" class="lab">Hasta</label><input class="in" type="date" id="of-to" value="'+esc(ordFilter.to)+'"></div></div></div>'+
 '<div class="list">'+(list.length?list.map(function(o){var hist=(o.history||[]).map(function(h){return esc(h.status)+' · '+esc(new Date(h.at).toLocaleString('es-NI',{timeZone:'America/Managua',dateStyle:'medium',timeStyle:'short'}))}).join('<br>');var phone=String(o.phone||'').replace(/\D/g,'');if(phone.length===8)phone='505'+phone;
  return '<details class="ord"><summary><div style="min-width:0"><b class="num">#'+esc(o.num)+'</b> · '+esc(o.name||'Sin nombre')+'<div class="muted" style="font-size:13px">'+esc(o.dateText||'')+(o.time?', '+esc(o.time):'')+' · '+(o.mode==='pickup'?'Retiro':'Envío')+'</div></div><div style="text-align:right"><span class="st '+esc(String(o.status).split(' ')[0])+'">'+esc(o.status)+'</span><div class="num">'+money(o.total)+'</div></div></summary><div class="body">'+
  '<div class="field"><label class="lab" for="os-'+esc(o._id)+'">Estado</label><select class="in" id="os-'+esc(o._id)+'" data-ost="'+esc(o._id)+'">'+STATUSES.map(function(s){return '<option'+(o.status===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div>'+
  '<div><b>Teléfono:</b> '+esc(o.phone||'')+'</div>'+(o.addressText?'<div><b>Dirección:</b> '+esc(o.addressText)+'</div>':'')+(o.pay?'<div><b>Pago:</b> '+esc(o.pay)+'</div>':'')+(o.notes?'<div><b>Instrucciones:</b> '+esc(o.notes)+'</div>':'')+
  '<pre>'+esc(o.raw||'')+'</pre><div class="hist"><b>Historial</b><br>'+(hist||'Sin cambios')+'</div><div style="display:flex;gap:8px;flex-wrap:wrap">'+(phone?'<a class="btn btn-soft btn-sm" target="_blank" rel="noopener" href="https://wa.me/'+esc(phone)+'?text='+encodeURIComponent('Hola '+(o.name||'')+', te escribimos de '+S.settings.name+' sobre tu pedido #'+o.num+'.')+'">Escribir al cliente</a>':'')+'<button class="btn btn-soft btn-sm danger" data-odel="'+esc(o._id)+'">Borrar pedido</button></div></div></details>'}).join(''):'<p class="muted">No hay pedidos con estos filtros.</p>')+'</div>';
 $('#ordSave').onclick=function(){var t=$('#ordImport').value.trim();if(!t){toast('Pega primero el mensaje del pedido',true);return}var o=parseOrder(t);var now=new Date().toISOString();var id=String(o.num).replace(/[^A-Za-z0-9-]/g,'')||uid('o');var docd={num:o.num,name:o.name,phone:o.phone,items:o.items,sub:o.sub,disc:o.disc,ship:o.ship,total:o.total,mode:o.mode,addressText:o.addressText,dateText:o.dateText,time:o.time,pay:o.pay,notes:o.notes,raw:o.raw,status:'Nuevo',createdAt:now,createdDay:todayMGA(),history:[{status:'Nuevo',at:now}]};
  caps.db.collection('orders').doc(id).set(docd).then(function(){$('#ordImport').value='';toast('Pedido #'+o.num+' guardado')}).catch(function(e){toast(e&&e.code==='not_granted'?'Tu cuenta no puede guardar pedidos.':'No se pudo guardar el pedido.',true)})};
 $$('[data-st]',v).forEach(function(b){b.onclick=function(){ordFilter.st=b.dataset.st;drawAdmin()}});
 var qt;$('#of-q').oninput=function(e){ordFilter.q=e.target.value;clearTimeout(qt);qt=setTimeout(function(){drawAdmin();var i=$('#of-q');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},400)};
 $('#of-from').onchange=function(e){ordFilter.from=e.target.value;drawAdmin()};$('#of-to').onchange=function(e){ordFilter.to=e.target.value;drawAdmin()};
 $$('[data-ost]',v).forEach(function(s){s.onchange=function(){var o=orders.filter(function(x){return x._id===s.dataset.ost})[0];var h=(o.history||[]).concat([{status:s.value,at:new Date().toISOString()}]);caps.db.collection('orders').doc(o._id).update({status:s.value,history:h}).then(function(){toast('Pedido #'+o.num+': '+s.value)}).catch(function(){toast('No se pudo cambiar el estado.',true)})}});
 $$('[data-odel]',v).forEach(function(b){b.onclick=function(){modal('<h3>Borrar pedido</h3><p class="muted">Se borra de tu lista para siempre.</p><div style="display:grid;gap:10px"><button class="btn" id="yes" style="background:var(--bad);border-color:var(--bad)">Borrar</button><button class="btn btn-ghost" data-close>Cancelar</button></div>',function(m,c){$('#yes',m).onclick=function(){caps.db.collection('orders').doc(b.dataset.odel).delete().then(function(){c();toast('Pedido borrado')}).catch(function(){c();toast('No se pudo borrar.',true)})}})}});
}
